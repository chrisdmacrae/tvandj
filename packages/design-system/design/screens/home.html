<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home screen</title><link rel="stylesheet" href="../components.css"></head>
<body><div class="preview">
<div class="tv-frame">
<div class="t-headline" style="margin-bottom:var(--space-lg)">Home</div>
<section class="ds-shelf"><h2 class="ds-shelf__title t-title">Continue Watching</h2><div class="ds-shelf__items">

<div class="ds-poster ds-poster--landscape"><div class="ds-poster__art art-2"><div class="ds-progress"><span style="width:20%"></span></div></div><div class="ds-poster__meta"><div class="t-label">Dune: Part Two</div><div class="t-caption tone-secondary">2h 3m left</div></div></div>
<div class="ds-poster ds-poster--landscape"><div class="ds-poster__art art-4"><div class="ds-progress"><span style="width:85%"></span></div></div><div class="ds-poster__meta"><div class="t-label">Shōgun</div><div class="t-caption tone-secondary">S1:E9</div></div></div>
<div class="ds-poster ds-poster--landscape"><div class="ds-poster__art art-3"></div></div>
</div></section>
<section class="ds-shelf"><h2 class="ds-shelf__title t-title">Recently Added Movies</h2><div class="ds-shelf__items">
<div class="ds-poster"><div class="ds-poster__art art-1"></div></div><div class="ds-poster"><div class="ds-poster__art art-5"><span class="ds-badge ds-badge--neutral">4K</span></div></div>
<div class="ds-poster"><div class="ds-poster__art art-3"></div></div><div class="ds-poster"><div class="ds-poster__art art-6"></div></div>
<div class="ds-poster"><div class="ds-poster__art art-2"></div></div><div class="ds-poster"><div class="ds-poster__art art-4"></div></div><div class="ds-poster"><div class="ds-poster__art art-1"></div></div>
</div></section>
</div>
</div></body></html>
