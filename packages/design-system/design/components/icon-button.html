<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>IconButton</title><link rel="stylesheet" href="../components.css"></head>
<body><div class="preview">
<div class="row" style="align-items:center">
<button class="ds-icon-button" aria-label="Back"><svg viewBox="0 0 24 24" fill="none"><path d="M19 12H5M11 18l-6-6 6-6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
<span class="t-caption tone-secondary">Rest</span>
<button class="ds-icon-button is-focused" aria-label="Back"><svg viewBox="0 0 24 24" fill="none"><path d="M19 12H5M11 18l-6-6 6-6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
<span class="t-caption tone-secondary">Focused</span>
</div>
<div class="row" style="align-items:center;margin-top:16px">
<button class="ds-icon-button is-selected" aria-label="Shuffle"><svg viewBox="0 0 24 24" fill="none"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
<span class="t-caption tone-secondary">Selected (shuffle on)</span>
<button class="ds-icon-button" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M19 6.2v11.6a.8.8 0 0 1-1.25.66L9.5 12.7a.8.8 0 0 1 0-1.4l8.25-5.76A.8.8 0 0 1 19 6.2z" fill="currentColor"/><path d="M4.5 5.5H7v13H4.5z" fill="currentColor"/></svg></button>
<button class="ds-icon-button is-focused" style="width:56px;height:56px" aria-label="Pause"><svg viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" fill="currentColor"/></svg></button>
<button class="ds-icon-button" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M5 6.2v11.6a.8.8 0 0 0 1.25.66L14.5 12.7a.8.8 0 0 0 0-1.4L6.25 5.54A.8.8 0 0 0 5 6.2z" fill="currentColor"/><path d="M17 5.5h2.5v13H17z" fill="currentColor"/></svg></button>
<button class="ds-icon-button" aria-label="Repeat"><svg viewBox="0 0 24 24" fill="none"><path d="M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
<span class="t-caption tone-secondary">Transport: previous, play/pause (large, focused), next, repeat</span>
</div>
</div></body></html>
