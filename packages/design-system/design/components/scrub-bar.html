<!-- @dsCard group="Components" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScrubBar</title><link rel="stylesheet" href="../components.css"></head>
<body><div class="preview" style="max-width:640px">
<div><span class="t-caption tone-secondary">Rest, playing</span>
<div class="ds-scrub"><div class="ds-scrub__track"><div class="ds-scrub__fill" style="width:35%"></div></div><span class="ds-scrub__knob is-playing" style="left:35%"></span></div></div>
<div><span class="t-caption tone-secondary">Focused, paused — OK plays/pauses</span>
<div class="ds-scrub is-focused"><div class="ds-scrub__track"><div class="ds-scrub__fill" style="width:48%"></div></div><span class="ds-scrub__knob" style="left:48%"></span></div></div>
<div style="margin-top:24px"><span class="t-caption tone-secondary">Focused, rewinding at 2s/s — Left = faster, Right = slower, OK = resume here</span>
<div class="ds-scrub is-focused" style="margin-top:16px"><div class="ds-scrub__track"><div class="ds-scrub__fill" style="width:62%"></div></div><span class="ds-scrub__knob" style="left:62%"></span><span class="ds-scrub__label" style="left:62%">◀◀ 2s/s</span></div></div>
</div></body></html>
