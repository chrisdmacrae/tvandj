<!-- @dsCard group="Components" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PosterCard</title><link rel="stylesheet" href="../components.css"></head>
<body><div class="preview">
<div class="row" style="padding:12px">
<div class="ds-poster"><div class="ds-poster__art art-1"></div><div class="ds-poster__meta"><div class="t-label">Portrait</div><div class="t-caption tone-secondary">rest</div></div></div>
<div class="ds-poster is-focused"><div class="ds-poster__art art-2"><span class="ds-badge">3</span></div><div class="ds-poster__meta"><div class="t-label">Focused</div><div class="t-caption tone-secondary">unplayed badge</div></div></div>
<div class="ds-poster"><div class="ds-poster__art art-3"><span class="ds-badge ds-badge--success">✓</span></div><div class="ds-poster__meta"><div class="t-label">Watched</div><div class="t-caption tone-secondary">2021</div></div></div>
<div class="ds-poster"><div class="ds-poster__art">No artwork</div><div class="ds-poster__meta"><div class="t-label">Fallback</div><div class="t-caption tone-secondary">title shown</div></div></div>
</div>
<div class="row" style="padding:12px">
<div class="ds-poster ds-poster--landscape"><div class="ds-poster__art art-4"><div class="ds-progress"><span style="width:40%"></span></div></div><div class="ds-poster__meta"><div class="t-label">Landscape · in progress</div><div class="t-caption tone-secondary">S2:E4 · 28m left</div></div></div>
<div class="ds-poster ds-poster--square is-focused"><div class="ds-poster__art art-5"></div><div class="ds-poster__meta"><div class="t-label">Square</div><div class="t-caption tone-secondary">Album</div></div></div>
</div>
</div></body></html>
