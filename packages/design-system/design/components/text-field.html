<!-- @dsCard group="Components" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>TextField</title><link rel="stylesheet" href="../components.css"></head>
<body><div class="preview" style="max-width:420px">
<label class="ds-field"><span class="ds-field__label t-label">Server address</span><input class="ds-field__input" placeholder="192.168.1.20 or jellyfin.example.com"><span class="ds-field__message t-caption">Rest</span></label>
<label class="ds-field is-focused"><span class="ds-field__label t-label">Server address</span><input class="ds-field__input" value="192.168.1.20"><span class="ds-field__message t-caption">Focused — press Select to type</span></label>
<label class="ds-field has-error"><span class="ds-field__label t-label">Server address</span><input class="ds-field__input" value="jelyfin.local"><span class="ds-field__message t-caption">Couldn't reach a Jellyfin server at that address.</span></label>
</div></body></html>
