<!-- @dsCard group="Components" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avatar</title><link rel="stylesheet" href="../components.css"></head>
<body><div class="preview">
<div class="row" style="align-items:center">
<span class="ds-avatar" style="background:var(--color-accent)">CM</span>
<span class="ds-avatar" style="background:var(--color-highlight)">K</span>
<span class="ds-avatar" style="background:var(--color-success)">G</span>
<span class="ds-avatar-button is-focused"><span class="ds-avatar" style="background:var(--color-warning);width:34px;height:34px">D</span></span>
<span class="t-caption tone-secondary">Initials on a per-name colour · focused switcher button</span>
</div>
<div class="ds-list" style="max-width:340px;padding:16px;border-radius:12px;background:var(--color-surface)">
<span class="t-label tone-secondary">Who’s watching?</span>
<div class="ds-list-item is-focused"><span class="ds-avatar" style="background:var(--color-warning)">D</span><div class="ds-list-item__body"><div class="t-title">dev</div><div class="ds-list-item__subtitle t-caption">Watching now</div></div></div>
<div class="ds-list-item"><span class="ds-avatar" style="background:var(--color-highlight)">K</span><div class="ds-list-item__body"><div class="t-title">Kids</div></div></div>
<div class="ds-list-item"><span class="ds-avatar" style="background:var(--color-success)">G</span><div class="ds-list-item__body"><div class="t-title">Guest</div><div class="ds-list-item__subtitle t-caption">Sign in needed</div></div></div>
</div>
</div></body></html>
