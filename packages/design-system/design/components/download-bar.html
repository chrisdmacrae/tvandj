<!-- @dsCard group="Components" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>DownloadBar</title><link rel="stylesheet" href="../components.css"></head>
<body><div class="preview">
<div style="max-width:320px;display:flex;flex-direction:column;gap:16px">
<div><span class="t-caption tone-secondary">Downloading 42%</span><div class="ds-download"><span style="width:42%"></span></div></div>
<div><span class="t-caption tone-secondary">Searching / adding to library (indeterminate)</span><div class="ds-download is-indeterminate"><span></span></div></div>
<div><span class="t-caption tone-secondary">Playback position (static ProgressBar), for contrast</span><div class="ds-progress"><span style="width:42%"></span></div></div>
</div>
<div class="row" style="padding:12px">
<div class="ds-poster"><div class="ds-poster__art art-1"><div class="ds-download"><span style="width:64%"></span></div></div><div class="ds-poster__meta"><div class="t-label">Elephants Dream</div><div class="t-caption ds-poster__status">Downloading 64%</div></div></div>
<div class="ds-poster"><div class="ds-poster__art art-3"><div class="ds-download is-indeterminate"><span></span></div></div><div class="ds-poster__meta"><div class="t-label">Severance</div><div class="t-caption ds-poster__status">Searching…</div></div></div>
<div class="ds-poster"><div class="ds-poster__art art-2"></div><div class="ds-poster__meta"><div class="t-label">Andor</div><div class="t-caption tone-secondary">In your library</div></div></div>
</div>
</div></body></html>
