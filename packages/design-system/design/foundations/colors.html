<!-- @dsCard group="Colors" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Color tokens</title><link rel="stylesheet" href="../components.css"></head>
<body><div class="preview">
<style>.sw{width:136px}.sw i{display:block;height:64px;border-radius:var(--radius-md);box-shadow:inset 0 0 0 1px var(--color-border)}.sw b{display:block;margin-top:6px}</style>
<h2 class="t-title">Surfaces</h2>
<div class="row">
<div class="sw t-caption"><i style="background:var(--color-canvas)"></i><b>canvas</b><span class="tone-secondary">#0B0D12</span></div>
<div class="sw t-caption"><i style="background:var(--color-surface)"></i><b>surface</b><span class="tone-secondary">#151923</span></div>
<div class="sw t-caption"><i style="background:var(--color-surface-raised)"></i><b>surfaceRaised</b><span class="tone-secondary">#1E2330</span></div>
<div class="sw t-caption"><i style="background:var(--color-surface-focused)"></i><b>surfaceFocused</b><span class="tone-secondary">#2A3142</span></div>
<div class="sw t-caption"><i style="background:var(--color-border)"></i><b>border</b><span class="tone-secondary">#2A3040</span></div>
</div>
<h2 class="t-title">Text</h2>
<div class="row">
<div class="sw t-caption"><i style="background:var(--color-text-primary)"></i><b>textPrimary</b><span class="tone-secondary">#F4F5F8</span></div>
<div class="sw t-caption"><i style="background:var(--color-text-secondary)"></i><b>textSecondary</b><span class="tone-secondary">#A8AEBD</span></div>
<div class="sw t-caption"><i style="background:var(--color-text-tertiary)"></i><b>textTertiary</b><span class="tone-secondary">#6B7283</span></div>
</div>
<h2 class="t-title">Brand, focus &amp; status</h2>
<div class="row">
<div class="sw t-caption"><i style="background:var(--color-accent)"></i><b>accent</b><span class="tone-secondary">#8B7CFF</span></div>
<div class="sw t-caption"><i style="background:var(--color-accent-strong)"></i><b>accentStrong</b><span class="tone-secondary">#A99DFF</span></div>
<div class="sw t-caption"><i style="background:var(--color-highlight)"></i><b>highlight</b><span class="tone-secondary">#3CC8E8</span></div>
<div class="sw t-caption"><i style="background:var(--color-focus-ring)"></i><b>focusRing</b><span class="tone-secondary">#FFFFFF</span></div>
<div class="sw t-caption"><i style="background:var(--color-success)"></i><b>success</b><span class="tone-secondary">#4ADE80</span></div>
<div class="sw t-caption"><i style="background:var(--color-warning)"></i><b>warning</b><span class="tone-secondary">#FBBF24</span></div>
<div class="sw t-caption"><i style="background:var(--color-danger)"></i><b>danger</b><span class="tone-secondary">#F87171</span></div>
</div>
</div></body></html>
