# TV and J's web app (the PWA) on a Linux box. setup.sh downloads this next to itself, with the
# Caddyfile, writes .env and starts it:
#
#   curl -fsSL https://raw.githubusercontent.com/chrisdmacrae/tvandj/main/deploy/setup.sh | bash
#
# - pwa:   the static app behind nginx, prebuilt for amd64 and arm64 from apps/pwa/Dockerfile.
# - caddy: optional HTTPS in front of it, with a free Let's Encrypt certificate for DOMAIN
#          (`--profile https`). Browsers only install the app, and only run its service worker,
#          over HTTPS (or on localhost).
name: tvandj

services:
  pwa:
    image: ${PWA_IMAGE:-ghcr.io/chrisdmacrae/tvandj-pwa:latest}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"

  caddy:
    profiles: [https]
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [pwa]
    environment:
      DOMAIN: ${DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates live here; keep them across restarts to stay clear of Let's Encrypt's rate limits.
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
