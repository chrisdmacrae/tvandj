plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'dev.chrisdmacrae.tvandj'
version = '0.1.0'

android {
  namespace "dev.chrisdmacrae.tvandj.discovery"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  // Watch Next ("Continue watching") on the Android TV home screen.
  implementation "androidx.tvprovider:tvprovider:1.1.0"
}
