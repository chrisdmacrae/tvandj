<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover: draw under the iPhone notch and home bar; the app pads with safe-area insets. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <meta name="description" content="Your Jellyfin library, on every screen." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <!-- iOS home screen: full-screen app with its own icon and title. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TV and J" />
    <meta name="color-scheme" content="dark" />
    <!-- The react-native-web reset, plus the app's dark canvas before any JS runs. -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background: #0b0d12;
        color: #f4f5f8;
      }
      body {
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run TV and J.</noscript>
    <div id="root"></div>
  </body>
</html>
