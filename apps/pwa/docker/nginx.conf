server {
  listen 80;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

  # Built files carry content hashes in their names: cache them forever.
  location /_expo/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # The service worker and manifest must always be fresh, or updates never reach installed apps.
  location = /sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }
  location = /manifest.webmanifest {
    types {}
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Everything else is the single-page app: unknown paths get index.html, never cached.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
