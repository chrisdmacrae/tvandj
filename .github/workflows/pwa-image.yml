# Builds the PWA's Docker image (static files behind nginx, see apps/pwa/Dockerfile) and pushes
# it to GitHub Container Registry: ghcr.io/<owner>/<repo>-pwa. Pushes to main are tagged `main`
# and with the commit; releases (release.yml, a v<version> tag) call this with the version, and
# tag it with that and `latest`, which is what deploy/setup.sh installs. Pull requests build
# without pushing.
name: PWA image

on:
  workflow_call:
    inputs:
      version:
        description: The release's version, e.g. 1.0.5; tagged along with `latest`.
        type: string
        required: true
  push:
    branches: [main]
    paths:
      - 'apps/pwa/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.dockerignore'
      - '.github/workflows/pwa-image.yml'
  pull_request:
    paths:
      - 'apps/pwa/**'
      - 'packages/**'
      - 'apps/pwa/Dockerfile'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  # Its own group when a release calls it, so the two don't cancel each other.
  group: pwa-image-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-pwa
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != null && inputs.version != '' }}
            type=raw,value=latest,enable=${{ inputs.version != null && inputs.version != '' }}
            type=ref,event=pr

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/pwa/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            EXPO_PUBLIC_OMDB_API_KEY=${{ secrets.OMDB_API_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
