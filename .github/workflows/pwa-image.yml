# Builds the PWA's Docker image (static files behind nginx, see apps/pwa/Dockerfile) and pushes
# it to GitHub Container Registry: ghcr.io/<owner>/<repo>-pwa, tagged `latest` and with the commit
# from main, and with the version from tags like pwa-v1.2.0. Pull requests build without pushing.
name: PWA image

on:
  push:
    branches: [main]
    tags: ['pwa-v*']
    paths:
      - 'apps/pwa/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.dockerignore'
      - '.github/workflows/pwa-image.yml'
  pull_request:
    paths:
      - 'apps/pwa/**'
      - 'packages/**'
      - 'apps/pwa/Dockerfile'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: pwa-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-pwa
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,enable={{is_default_branch}}
            type=match,pattern=pwa-v(.*),group=1
            type=ref,event=pr

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/pwa/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            EXPO_PUBLIC_OMDB_API_KEY=${{ secrets.OMDB_API_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
